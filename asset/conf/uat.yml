app:
  name: senspace
  pagesize: 10
  jwtsecret: 233
  prefixurl: http://127.0.0.1:8000
  runtimerootpath: runtime/
  pluginSourceRoot: /usr/local/app/senspace/runtime/plugin-source
  pluginRuntimeRoot: /usr/local/app/senspace/runtime/plugin-runtime
  pluginBuilderImage: senspace/plugin-builder:latest
  pluginBuildTimeoutSec: 120
  pluginBuildCpu: "1.5"
  pluginBuildMemory: 512m
  pluginBuildPidsLimit: 128
  pluginBuildTmpfs: /tmp:rw,noexec,nosuid,size=256m
  imagesavepath: upload/images/
  # MB
  imageMaxSize: 5
  imageexts: [.jpg,.jpeg,.png]
  exportSavePath: export/
  qrCodeSavePath: qrcode/
  fontSavePath: fonts/
  logSavePath: var/log/senspace
  logSaveName: log
  logFileExt: log
  timeFormat: 20060102
  filePath:
    book: /usr/local/app/senspace/runtime/book
    font: /usr/local/app/senspace/runtime/font
    image: /usr/local/app/senspace/runtime/image
    plugin: /usr/local/app/senspace/runtime/plugin
    factory: /usr/local/app/senspace/runtime/factory
server:
  runmode: debug
  port: 9010
  readtimeout: 60
  writetimeout: 60
database:
  type: mysql
  user: root
  password: smart@vserp
  #docker连接地址 端口非导出的端口
  host: mysql:3306
  name: senspace
redis:
  host: ${s90}:6379
  password:
  maxIdle: 30
  maxActive: 30
  idleTimeout: 200

s90: localhost
